<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>zennX</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #17212b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            background-color: #242f3d;
            padding: 40px 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #64b5f6;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .input-group { margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            background-color: #17212b;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { outline: 2px solid #64b5f6; }
        .btn-primary {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            background-color: #64b5f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-secondary {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            background-color: transparent;
            color: #64b5f6;
            font-size: 16px;
            cursor: pointer;
        }
        .error { color: #ff6b6b; margin-top: 15px; font-size: 14px; }
        .chat-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #17212b;
        }
        .header {
            background-color: #242f3d;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #64b5f6;
            text-align: center;
            border-bottom: 1px solid #17212b;
        }
        .chat-list { flex: 1; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-screen">
        <div class="logo">zennX</div>
        <div class="input-group"><input type="email" id="email" placeholder="Email"></div>
        <div class="input-group"><input type="password" id="password" placeholder="Пароль"></div>
        <button id="login-btn" class="btn-primary">Войти</button>
        <button id="register-btn" class="btn-secondary">Создать аккаунт</button>
        <div id="error-message" class="error"></div>
    </div>

    <div class="chat-container" id="chat-screen" style="display: none;">
        <div class="header"><span>zennX</span></div>
        <div class="chat-list" id="chat-list">
            <p style="text-align: center; color: gray; margin-top: 50px;">Здесь будут ваши чаты</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6_zcgE-gfoqfC2xg2-YCik_JMX1AwATk",
            authDomain: "zennx-99263.firebaseapp.com",
            projectId: "zennx-99263",
            storageBucket: "zennx-99263.firebasestorage.app",
            messagingSenderId: "783536451112",
            appId: "1:783536451112:web:feaea6c065433d7ffe0f1d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const errorMessage = document.getElementById('error-message');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
            } else {
                authScreen.style.display = 'block';
                chatScreen.style.display = 'none';
            }
        });

        loginBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            errorMessage.textContent = '';
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => { errorMessage.textContent = "Ошибка: " + error.message; });
        });

        registerBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            errorMessage.textContent = '';
            createUserWithEmailAndPassword(auth, email, password)
                .catch((error) => { errorMessage.textContent = "Ошибка: " + error.message; });
        });
    </script>
</body>
</html>
