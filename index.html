<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>zennX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #0e1621;
            --surface-color: #17212b;
            --surface-light: #242f3d;
            --primary-color: #5288c1;
            --text-main: #ffffff;
            --text-muted: #7f91a4;
            --danger-color: #e53935;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
        }

        /* --- ЭКРАН АВТОРИЗАЦИИ --- */
        #auth-screen { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            padding: 24px; 
            background: linear-gradient(135deg, #0e1621 0%, #17212b 100%);
        }

        .auth-box { 
            width: 100%; 
            max-width: 380px; 
            text-align: center;
        }

        .logo { 
            font-size: 36px; 
            font-weight: 600; 
            color: var(--text-main); 
            margin-bottom: 8px; 
            letter-spacing: -0.5px;
        }

        .logo span { color: var(--primary-color); }

        .subtitle { 
            color: var(--text-muted); 
            font-size: 14px; 
            margin-bottom: 40px; 
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        input { 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            border: 1px solid var(--surface-light); 
            background-color: var(--surface-color); 
            color: var(--text-main); 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primary-color); }
        input::placeholder { color: var(--text-muted); }

        .btn { 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            border: none; 
            font-size: 16px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: all 0.2s; 
        }

        .btn-primary { 
            background-color: var(--primary-color); 
            color: white; 
            margin-top: 10px;
        }
        
        .btn-primary:active { opacity: 0.8; transform: scale(0.98); }

        .btn-secondary { 
            background-color: transparent; 
            color: var(--primary-color); 
            margin-top: 16px;
        }

        .error { 
            color: var(--danger-color); 
            margin-top: 16px; 
            font-size: 14px; 
            background: rgba(229, 57, 53, 0.1);
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        #main-screen { display: none; flex-direction: column; height: 100vh; }

        .header { 
            background-color: var(--surface-color); 
            padding: 16px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-title { 
            font-size: 22px; 
            font-weight: 600; 
            color: var(--text-main); 
        }

        .header-icons { display: flex; gap: 24px; color: var(--text-muted); font-size: 20px; }
        .header-icons i { cursor: pointer; transition: color 0.2s; }
        .header-icons i:active { color: var(--primary-color); }

        .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }

        /* --- ЧАТЫ --- */
        .chat-list { display: flex; flex-direction: column; gap: 8px; }
        
        .empty-state { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: var(--text-muted); 
            text-align: center;
            gap: 12px;
        }

        .empty-state i { font-size: 48px; opacity: 0.5; }

        .chat-item { 
            display: flex; 
            align-items: center; 
            padding: 12px; 
            border-radius: 14px; 
            background-color: var(--surface-color); 
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .chat-item:active { background-color: var(--surface-light); }

        .chat-avatar { 
            width: 56px; 
            height: 56px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, var(--primary-color), #3a6ea5); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 22px; 
            font-weight: 600; 
            color: #fff; 
            margin-right: 16px; 
            flex-shrink: 0;
        }

        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .chat-last-msg { color: var(--text-muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- НАСТРОЙКИ --- */
        .settings-group {
            background-color: var(--surface-color);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .settings-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 16px; 
            border-bottom: 1px solid var(--bg-color); 
        }
        .settings-item:last-child { border-bottom: none; }

        .settings-left { display: flex; align-items: center; gap: 16px; }
        .settings-icon { 
            width: 32px; 
            height: 32px; 
            border-radius: 8px; 
            background-color: var(--surface-light); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: var(--primary-color);
            font-size: 16px;
        }

        .settings-label { font-size: 16px; }
        .settings-value { color: var(--text-muted); font-size: 15px; }
        .settings-value.highlight { color: var(--primary-color); font-weight: 600; }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav { 
            background-color: var(--surface-color); 
            display: flex; 
            padding: 12px 0; 
            border-top: 1px solid var(--bg-color);
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .nav-item { 
            flex: 1; 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 12px; 
            cursor: pointer; 
            transition: all 0.2s; 
        }

        .nav-item i { 
            font-size: 22px; 
            margin-bottom: 6px; 
            display: block; 
            transition: transform 0.2s;
        }

        .nav-item.active { color: var(--primary-color); }
        .nav-item.active i { transform: translateY(-2px); }

        /* --- КНОПКА ДЕЙСТВИЯ --- */
        .fab { 
            position: fixed; 
            bottom: 80px; 
            right: 20px; 
            width: 56px; 
            height: 56px; 
            border-radius: 50%; 
            background-color: var(--primary-color); 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 22px; 
            box-shadow: 0 4px 12px rgba(82, 136, 193, 0.4); 
            cursor: pointer; 
            transition: transform 0.2s;
            z-index: 20;
        }

        .fab:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen">
        <div class="auth-box">
            <div class="logo">zenn<span>X</span></div>
            <div class="subtitle">Добро пожаловать в новый мессенджер</div>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="Электронная почта">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Пароль">
            </div>
            
            <button id="login-btn" class="btn btn-primary">Войти</button>
            <button id="register-btn" class="btn btn-secondary">Создать аккаунт</button>
            
            <div id="error-message" class="error"></div>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-screen">
        <div class="header">
            <div class="header-title">zennX</div>
            <div class="header-icons">
                <i class="fas fa-search"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>

        <div class="content">
            <!-- ВКЛАДКА ЧАТЫ -->
            <div id="tab-chats">
                <div class="empty-state" id="empty-chats">
                    <i class="far fa-comments"></i>
                    <div>У вас пока нет чатов.<br>Начните общение первым!</div>
                </div>
                <div class="chat-list" id="chat-list"></div>
            </div>

            <!-- ВКЛАДКА НАСТРОЙКИ -->
            <div id="tab-settings" style="display: none;">
                <div class="settings-group">
                    <div class="settings-item">
                        <div class="settings-left">
                            <div class="settings-icon"><i class="fas fa-id-badge"></i></div>
                            <span class="settings-label">Мой ID</span>
                        </div>
                        <span class="settings-value highlight" id="my-id">Загрузка...</span>
                    </div>
                    <div class="settings-item">
                        <div class="settings-left">
                            <div class="settings-icon"><i class="fas fa-user"></i></div>
                            <span class="settings-label">Имя пользователя</span>
                        </div>
                        <span class="settings-value" id="my-email">...</span>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-item">
                        <div class="settings-left">
                            <div class="settings-icon" style="color: var(--text-muted);"><i class="fas fa-palette"></i></div>
                            <span class="settings-label">Оформление</span>
                        </div>
                        <span class="settings-value">Тёмная</span>
                    </div>
                    <div class="settings-item">
                        <div class="settings-left">
                            <div class="settings-icon" style="color: var(--text-muted);"><i class="fas fa-bell"></i></div>
                            <span class="settings-label">Уведомления</span>
                        </div>
                        <span class="settings-value">Вкл</span>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-item" style="cursor: pointer;" id="logout-btn">
                        <div class="settings-left">
                            <div class="settings-icon" style="color: var(--danger-color); background: rgba(229, 57, 53, 0.1);"><i class="fas fa-sign-out-alt"></i></div>
                            <span class="settings-label" style="color: var(--danger-color);">Выйти из аккаунта</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопка плюса -->
        <div class="fab" id="new-chat-btn"><i class="fas fa-pen"></i></div>

        <!-- НИЖНЕЕ МЕНЮ -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-chats"><i class="fas fa-comment-alt"></i>Чаты</div>
            <div class="nav-item" id="nav-settings"><i class="fas fa-cog"></i>Настройки</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6_zcgE-gfoqfC2xg2-YCik_JMX1AwATk",
            authDomain: "zennx-99263.firebaseapp.com",
            projectId: "zennx-99263",
            storageBucket: "zennx-99263.firebasestorage.app",
            messagingSenderId: "783536451112",
            appId: "1:783536451112:web:feaea6c065433d7ffe0f1d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authScreen = document.getElementById('auth-screen');
        const mainScreen = document.getElementById('main-screen');
        
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const errorMessage = document.getElementById('error-message');

        const tabChats = document.getElementById('tab-chats');
        const tabSettings = document.getElementById('tab-settings');
        const navChats = document.getElementById('nav-chats');
        const navSettings = document.getElementById('nav-settings');
        
        const myIdDisplay = document.getElementById('my-id');
        const myEmailDisplay = document.getElementById('my-email');
        const logoutBtn = document.getElementById('logout-btn');

        navChats.addEventListener('click', () => {
            navChats.classList.add('active');
            navSettings.classList.remove('active');
            tabChats.style.display = 'block';
            tabSettings.style.display = 'none';
        });

        navSettings.addEventListener('click', () => {
            navSettings.classList.add('active');
            navChats.classList.remove('active');
            tabChats.style.display = 'none';
            tabSettings.style.display = 'block';
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authScreen.style.display = 'none';
                mainScreen.style.display = 'flex';
                myEmailDisplay.textContent = user.email;
                
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);
                
                if (!userDoc.exists()) {
                    const randomId = "XZ-" + Math.floor(1000 + Math.random() * 9000);
                    await setDoc(userDocRef, {
                        email: user.email,
                        myId: randomId,
                        createdAt: new Date()
                    });
                    myIdDisplay.textContent = randomId;
                } else {
                    myIdDisplay.textContent = userDoc.data().myId;
                }

            } else {
                authScreen.style.display = 'flex';
                mainScreen.style.display = 'none';
            }
        });

        loginBtn.addEventListener('click', () => {
            errorMessage.style.display = 'none';
            signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .catch((error) => { 
                    errorMessage.textContent = "Ошибка: проверьте логин и пароль"; 
                    errorMessage.style.display = 'block';
                });
        });

        registerBtn.addEventListener('click', () => {
            errorMessage.style.display = 'none';
            createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .catch((error) => { 
                    if (error.code === 'auth/weak-password') {
                        errorMessage.textContent = "Пароль слишком короткий (минимум 6 символов)"; 
                    } else {
                        errorMessage.textContent = "Ошибка: " + error.message; 
                    }
                    errorMessage.style.display = 'block';
                });
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });
    </script>
</body>
</html>
